<div class="min-h-screen bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center p-4" dir="rtl">
  <div class="w-full max-w-sm bg-white/95 backdrop-blur rounded-3xl shadow-2xl p-8">

    <h1 class="text-2xl font-extrabold text-gray-800 mb-1 text-center">
      {{ isLoginMode() ? 'ورود' : 'ثبت‌نام' }}
    </h1>
    <p class="text-sm text-gray-400 text-center mb-6">
      به لیست تسک‌هات خوش اومدی
    </p>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <input
        type="email"
        [(ngModel)]="email"
        name="email"
        placeholder="ایمیل"
        required
        class="w-full border-2 border-gray-200 rounded-2xl px-4 py-3 text-gray-700 focus:outline-none focus:border-indigo-400 transition-colors"
      />
      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="رمز عبور"
        required
        class="w-full border-2 border-gray-200 rounded-2xl px-4 py-3 text-gray-700 focus:outline-none focus:border-indigo-400 transition-colors"
      />

      @if (errorMessage()) {
        <p class="text-sm text-red-500 text-center">{{ errorMessage() }}</p>
      }

      <button
        type="submit"
        class="w-full bg-gradient-to-br from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold py-3 rounded-2xl transition-all active:scale-95 shadow-lg shadow-indigo-200"
      >
        {{ isLoginMode() ? 'ورود' : 'ثبت‌نام' }}
      </button>
    </form>

    <p class="text-sm text-gray-400 text-center mt-6">
      @if (isLoginMode()) {
        حساب نداری؟
        <button type="button" (click)="toggleMode()" class="text-indigo-500 font-semibold">ثبت‌نام کن</button>
      } @else {
        حساب داری؟
        <button type="button" (click)="toggleMode()" class="text-indigo-500 font-semibold">وارد شو</button>
      }
    </p>

  </div>
</div>
